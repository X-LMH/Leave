name: 功能建议
description: 讨论使用场景和改进方案
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 场景与当前限制
      description: 在什么情况下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的改进
      description: 简单描述你希望增加或调整的功能。
    validations:
      required: true
