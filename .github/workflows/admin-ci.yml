name: Leave Admin CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build admin
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - name: Prepare example build environments
        run: |
          cp .env.prod.example .env.prod
          cp .env.test.example .env.test
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm typecheck
      - name: Lint without modifying source
        run: pnpm exec oxlint && pnpm exec eslint .
      - name: Check formatting without modifying source
        run: pnpm exec oxfmt --check src packages build tests
      - name: Run existing Node tests
        run: node --test tests/*.test.mjs
      - name: Build admin
        run: pnpm build
      - name: Build admin for test environment
        run: pnpm build:test
