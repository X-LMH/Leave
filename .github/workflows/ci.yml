name: Leave Backend CI

on:
  push:
    branches:
      - master
  workflow_call:
    inputs:
      release_artifact:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check, test and build backend
    runs-on: ubuntu-22.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: leave_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check Go format
        working-directory: backend
        run: test -z "$(gofmt -l .)"

      - name: Run go vet
        working-directory: backend
        run: go vet ./...

      - name: Download Go dependencies
        working-directory: backend
        run: go mod download

      - name: Run Go tests
        working-directory: backend
        env:
          MYSQL_TEST_DSN: root:password@tcp(127.0.0.1:3306)/leave_ci?multiStatements=true
          ADMIN_TEST_MYSQL_DSN: root:password@tcp(127.0.0.1:3306)/leave_ci?multiStatements=true
        run: go test ./...

      - name: Test release metadata and shell coordination
        run: |
          ruby deploy/tests/release_test.rb
          bash deploy/tests/deploy_test.sh

      - name: Test App version SQL on isolated MySQL
        env:
          DEPLOY_TEST_MYSQL: '1'
          MYSQL_PWD: password
        run: ruby deploy/tests/sql_test.rb

      - name: Build Linux server and migration tool
        run: bash deploy/build-linux.sh

      - name: Upload backend release artifact
        if: inputs.release_artifact
        uses: actions/upload-artifact@v6
        with:
          name: backend-bin
          path: bin/
          if-no-files-found: error
