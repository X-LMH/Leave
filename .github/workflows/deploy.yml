# 持续交付（CD）流程：只有推送版本 Tag 时才执行正式发布。
name: Leave Backend CD

on:
  push:
    branches:
      - deploy

# 同一个 Tag 重复触发时不取消正在进行的发布，避免产生不完整的发布结果
concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 在 Tag 对应的 commit 上复用 CI workflow。
  # 发布前会执行格式检查、静态检查、测试和构建验证。
  ci:
    name: Run CI for release tag
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Upload Android APK
    # deploy 必须等待 ci 完成；CI 失败时，该 job 会被自动跳过。
    needs: ci
    if: needs.ci.result == 'success'
    runs-on: ubuntu-latest

    steps:
      # checkout 当前触发 CD 的版本，而不是默认分支的最新代码。
      - name: Check out tag
        uses: actions/checkout@v5

      # 使用 GitHub Repository Secrets 提供 SSH 连接参数和私钥，仓库不保存任何凭据。
      # 上传后服务器上的文件名为 app.apk，已存在的同名文件会被覆盖。
      - name: Upload Android APK
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: artifacts/android/app.apk
          target: /www/wwwroot
