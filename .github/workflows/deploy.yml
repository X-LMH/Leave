name: Leave CD

on:
  push:
    tags:
      - 'back-test-v*'
      - 'admin-test-v*'
      - 'app-test-v*'
      - 'back-v*'
      - 'admin-v*'
      - 'app-v*'

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release
    runs-on: ubuntu-22.04
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      environment: ${{ steps.release.outputs.environment }}
      app_root: ${{ steps.release.outputs.app_root }}
      admin_dist: ${{ steps.release.outputs.admin_dist }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Read unified release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ruby deploy/read-release.rb --tag "$RELEASE_TAG" --format github >> "$GITHUB_OUTPUT"
      - name: Verify Android APK version
        if: steps.release.outputs.mode == 'app'
        env:
          APK_PATH: ${{ steps.release.outputs.apk_path }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: bash deploy/verify-apk.sh "$APK_PATH" "$VERSION_NAME" "$VERSION_CODE"

  backend:
    name: Check and build backend
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      release_artifact: true

  admin:
    name: Check and build admin
    needs: metadata
    if: needs.metadata.outputs.mode == 'admin'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - name: Prepare selected environment
        env:
          RELEASE_ENV: ${{ needs.metadata.outputs.environment }}
        run: cp ".env.$RELEASE_ENV.example" ".env.$RELEASE_ENV"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm typecheck
      - name: Lint without modifying source
        run: pnpm exec oxlint && pnpm exec eslint .
      - name: Check formatting without modifying source
        run: pnpm exec oxfmt --check src packages build tests
      - name: Run existing Node tests
        run: node --test tests/*.test.mjs
      - name: Build admin
        env:
          RELEASE_ENV: ${{ needs.metadata.outputs.environment }}
        run: pnpm "build:$RELEASE_ENV"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: admin-dist
          path: admin/${{ needs.metadata.outputs.admin_dist }}/
          if-no-files-found: error

  deploy:
    name: Deploy to selected Baota project
    needs: [metadata, backend, admin]
    if: >-
      always() && !cancelled() &&
      needs.metadata.result == 'success' &&
      needs.backend.result == 'success' &&
      (needs.metadata.outputs.mode != 'admin' || needs.admin.result == 'success')
    runs-on: ubuntu-22.04
    environment: ${{ needs.metadata.outputs.environment }}
    timeout-minutes: 30
    concurrency:
      group: leave-${{ needs.metadata.outputs.environment }}-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Fetch annotated tags directly; a shallow tag checkout can create a
          # lightweight tag that conflicts with a later fetch of the real tag.
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: backend-bin
          path: bin
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.metadata.outputs.mode == 'admin'
        with:
          name: admin-dist
          path: admin/${{ needs.metadata.outputs.admin_dist }}
      - name: Prepare verified deployment bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ruby deploy/read-release.rb --tag "$RELEASE_TAG" --bundle bundle
          tar -czf bundle.tar.gz bundle
      - name: Prepare GitHub Release assets
        if: needs.metadata.outputs.mode == 'app' && needs.metadata.outputs.environment == 'prod'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ruby deploy/github-release.rb prepare github-release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: needs.metadata.outputs.mode == 'app' && needs.metadata.outputs.environment == 'prod'
        with:
          name: github-release
          path: github-release/
          if-no-files-found: error
      - name: Check SSH credentials
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SERVER_HOST" && test -n "$SERVER_PORT" && test -n "$SERVER_USERNAME" && test -n "$SERVER_SSH_KEY"
      - name: Prepare isolated upload directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_ENV: ${{ needs.metadata.outputs.environment }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: RUN_ID,RELEASE_ENV
          script: |
            set -eu
            case "$RELEASE_ENV" in
              test) root=/www/wwwroot/Leave_test ;;
              prod) root=/www/wwwroot/Leave ;;
              *) echo 'Invalid release environment' >&2; exit 1 ;;
            esac
            test "$(realpath "$root")" = "$root" && test ! -L "$root"
            test ! -L "$root/.deploy"
            mkdir -p "$root/.deploy"
            test ! -e "$root/.deploy/$RUN_ID"
            mkdir "$root/.deploy/$RUN_ID"
      - name: Upload bundle
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: bundle.tar.gz
          target: ${{ needs.metadata.outputs.app_root }}/.deploy/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Coordinate deployment
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_ENV: ${{ needs.metadata.outputs.environment }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: RUN_ID,RELEASE_ENV
          command_timeout: 25m
          script: |
            set -eu
            case "$RELEASE_ENV" in
              test) root=/www/wwwroot/Leave_test ;;
              prod) root=/www/wwwroot/Leave ;;
              *) echo 'Invalid release environment' >&2; exit 1 ;;
            esac
            stage="$root/.deploy/$RUN_ID"
            test "$(realpath "$stage")" = "$stage"
            cd "$stage"
            tar -xzf bundle.tar.gz
            bash "$stage/bundle/scripts/deploy-release.sh" "$RUN_ID" "$RELEASE_ENV"

  release:
    name: Publish GitHub Release
    needs: [metadata, deploy]
    if: >-
      always() && !cancelled() && needs.deploy.result == 'success' &&
      needs.metadata.outputs.mode == 'app' && needs.metadata.outputs.environment == 'prod'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: leave-github-release
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: github-release
          path: github-release
      - name: Publish verified APK and notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ruby deploy/github-release.rb publish github-release >> "$GITHUB_STEP_SUMMARY"
