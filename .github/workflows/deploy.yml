name: Leave Android Release

# 只有推送测试版本 Tag 时才触发本流程。
# 例如：test-v0.0.5
on:
  push:
    tags:
      - "test-v*"

# 同一个 Tag 重复推送时不取消正在执行的任务，避免 Release 上传到一半被中断。
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

# 创建或更新 Release 需要写入仓库内容的权限.
permissions:
  contents: write

jobs:
  release:
    name: Upload APK to GitHub Release
    runs-on: ubuntu-latest

    steps:
      # 下载触发本流程的 Tag 对应的代码。
      # APK 必须已经存在于这个 Tag 中，后续步骤才能找到它。
      - name: Check out release tag
        uses: actions/checkout@v4

      # 使用 GitHub Actions 自动提供的 Token 操作当前仓库的 Release。
      # APK_PATH 是仓库中 APK 的固定位置。
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          APK_PATH: artifacts/android/current/app.apk
        run: |
          # 先确认 APK 已经被提交到当前 Tag。
          # 如果文件不存在，立即失败，避免创建没有安装包的 Release。
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found: $APK_PATH" >&2
            exit 1
          fi

          # 去掉 Tag 前缀，得到用于 Release 标题的应用版本号。
          version="${TAG_NAME#test-v}"

          # 如果这个 Tag 已经有 Release，则覆盖同名 APK 附件。
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber
          else
            # 如果 Release 不存在，则创建 Release 并同时上传 APK。
            # --generate-notes 会根据提交记录自动生成发布说明。
            gh release create "$TAG_NAME" "$APK_PATH" \
              --title "Leave Android $version" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
