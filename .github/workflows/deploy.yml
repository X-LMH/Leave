name: Leave Android Release

# 只有推送测试版本 Tag 时才触发本流程。
# 例如：test-v0.0.5
on:
  push:
    branches:
      - deploy
    tags:
      - "test-v*"

# 同一个 Tag 重复推送时不取消正在执行的任务，避免 Release 上传到一半被中断。
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

# 创建或更新 Release 需要写入仓库内容的权限.
permissions:
  contents: write

jobs:
  release:
    name: Upload APK to GitHub Release
    runs-on: ubuntu-latest

    steps:
      # 下载 deploy 分支当前的文件。
      # APK 不要求存在于触发 CD 的 Tag 提交中，只要已经提交到 deploy 分支即可。
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: deploy

      # 使用 GitHub Actions 自动提供的 Token 操作当前仓库的 Release。
      # 工作流会自动查找 current 目录中的唯一 APK，不要求固定文件名。
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # 查找当前目录下的 APK 文件，不限制具体文件名。
          mapfile -t apk_files < <(find artifacts/android/current -maxdepth 1 -type f -iname '*.apk' -print | sort)

          # 约定当前目录必须且只能有一个 APK。
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No APK found in artifacts/android/current" >&2
            exit 1
          fi

          if [ "${#apk_files[@]}" -gt 1 ]; then
            echo "More than one APK found in artifacts/android/current:" >&2
            printf ' - %s\n' "${apk_files[@]}" >&2
            exit 1
          fi

          APK_PATH="${apk_files[0]}"
          echo "Using APK: $APK_PATH"

          # 去掉 Tag 前缀，得到用于 Release 标题的应用版本号。
          version="${TAG_NAME#test-v}"

          # 如果这个 Tag 已经有 Release，则覆盖同名 APK 附件。
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber
          else
            # 如果 Release 不存在，则创建 Release 并同时上传 APK。
            # --generate-notes 会根据提交记录自动生成发布说明。
            gh release create "$TAG_NAME" "$APK_PATH" \
              --title "Leave Android $version" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
