# 持续交付流程：推送 deploy 分支后发布当前版本。
name: Leave CD

on:
  push:
    branches:
      - deploy

# 同一个分支连续发布时不取消正在进行的发布，避免产生不完整的发布结果。
concurrency:
  group: leave-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先复用 CI，只有检查成功才允许触发服务器上传。
  ci:
    name: Run CI before deployment
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Upload APK and Go server
    needs: ci
    if: needs.ci.result == 'success'
    runs-on: ubuntu-latest

    steps:
      # 固定使用本次推送对应的提交，避免构建到其他分支的代码。
      - name: Check out release commit
        uses: actions/checkout@v5

      # 使用 backend/go.mod 声明的 Go 版本，保证本地和 CI 的编译环境一致。
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # manifest.json 含有注释，不能直接按标准 JSON 解析；这里只读取两个版本字段。
      # 输出同时作为 APK 文件名和服务器 releases 目录名，确保三者版本一致。
      - name: Read application version
        id: app-version
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const manifest = fs.readFileSync('frontend/manifest.json', 'utf8');

          function readManifestValue(name) {
            const match = manifest.match(new RegExp('"' + name + '"\\s*:\\s*"([^"]+)"'));
            if (!match) {
              throw new Error(`Missing ${name} in frontend/manifest.json`);
            }
            return match[1];
          }

          const versionName = readManifestValue('versionName');
          const versionCode = readManifestValue('versionCode');
          if (!/^\d+(?:\.\d+)*$/.test(versionName)) {
            throw new Error(`Invalid versionName: ${versionName}`);
          }
          if (!/^\d+$/.test(versionCode)) {
            throw new Error(`Invalid versionCode: ${versionCode}`);
          }

          console.log(`version_name=${versionName}`);
          console.log(`version_code=${versionCode}`);
          console.log(`apk_name=leave-android-${versionCode}-${versionName}.apk`);
          NODE

      # APK 只改发布文件名，不修改原始 artifacts/android/app.apk。
      # build-linux.sh 只编译 cmd/server，不编译或执行 cmd/migrate。
      - name: Prepare release artifacts
        env:
          APK_NAME: ${{ steps.app-version.outputs.apk_name }}
        run: |
          mkdir -p dist
          test -f artifacts/android/app.apk
          cp artifacts/android/app.apk "dist/$APK_NAME"
          bash deploy/build-linux.sh amd64

      # scp-action 不负责业务目录规划，先创建本次发布需要的两个目录。
      # 这里不创建、不触碰 scripts/ 和 backups/。
      - name: Prepare server release directories
        uses: appleboy/ssh-action@v1
        env:
          APP_ROOT: ${{ secrets.SERVER_APP_ROOT }}
          VERSION_NAME: ${{ steps.app-version.outputs.version_name }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: APP_ROOT,VERSION_NAME
          script: |
            set -eu
            test -n "$APP_ROOT" || { echo "SERVER_APP_ROOT is empty" >&2; exit 1; }
            case "$APP_ROOT" in /*) ;; *) echo "SERVER_APP_ROOT must be absolute" >&2; exit 1 ;; esac
            mkdir -p "$APP_ROOT/packages/android" "$APP_ROOT/releases/v$VERSION_NAME"

      # APK 是按版本保存的，不覆盖旧版本安装包，便于客户端回退或重新下载。
      - name: Upload versioned APK
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: dist/${{ steps.app-version.outputs.apk_name }}
          target: ${{ secrets.SERVER_APP_ROOT }}/packages/android
          strip_components: 1

      # 先把后端二进制放到版本目录，上传完成后才进行 current 切换和服务重启。
      - name: Upload versioned Go server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: bin/Leave
          target: ${{ secrets.SERVER_APP_ROOT }}/releases/v${{ steps.app-version.outputs.version_name }}
          strip_components: 1

      # 该步骤必须最后执行：替换 Leave_test 实际运行的文件、停止旧进程、重新启动并验证。
      # 以下三个路径必须对应宝塔 Leave_test 项目的真实配置，不能填写通用进程名或猜测路径。
      - name: Replace Leave_test binary and restart project
        uses: appleboy/ssh-action@v1
        env:
          APP_ROOT: ${{ secrets.SERVER_APP_ROOT }}
          VERSION_NAME: ${{ steps.app-version.outputs.version_name }}
          PROJECT_BINARY: ${{ secrets.SERVER_PROJECT_BINARY }}
          PROJECT_PID_FILE: ${{ secrets.SERVER_PROJECT_PID_FILE }}
          PROJECT_START_SCRIPT: ${{ secrets.SERVER_PROJECT_START_SCRIPT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: APP_ROOT,VERSION_NAME,PROJECT_BINARY,PROJECT_PID_FILE,PROJECT_START_SCRIPT
          script: |
            set -eu

            test -n "$APP_ROOT" || { echo "SERVER_APP_ROOT is empty" >&2; exit 1; }
            test -n "$VERSION_NAME" || { echo "VERSION_NAME is empty" >&2; exit 1; }
            test -n "$PROJECT_BINARY" || { echo "SERVER_PROJECT_BINARY is empty" >&2; exit 1; }
            test -n "$PROJECT_PID_FILE" || { echo "SERVER_PROJECT_PID_FILE is empty" >&2; exit 1; }
            test -n "$PROJECT_START_SCRIPT" || { echo "SERVER_PROJECT_START_SCRIPT is empty" >&2; exit 1; }
            release_dir="$APP_ROOT/releases/v$VERSION_NAME"
            release_binary="$release_dir/Leave"
            replacement_binary="$PROJECT_BINARY.new"

            test -f "$release_binary" || { echo "Go binary not found: $release_binary" >&2; exit 1; }
            test -x "$PROJECT_START_SCRIPT" || { echo "Start script is not executable: $PROJECT_START_SCRIPT" >&2; exit 1; }

            # 先准备临时文件，再替换宝塔项目实际使用的执行文件，避免直接覆盖正在运行的文件。
            install -m 0755 "$release_binary" "$replacement_binary"

            # 只读取 Leave_test 项目自己的 PID，并确认 PID 对应的命令确实是目标文件。
            if [ -f "$PROJECT_PID_FILE" ]; then
              old_pid="$(cat "$PROJECT_PID_FILE")"
              case "$old_pid" in
                ''|*[!0-9]*) echo "Invalid PID file: $PROJECT_PID_FILE" >&2; exit 1 ;;
              esac
              if [ -d "/proc/$old_pid" ] && tr '\0' ' ' < "/proc/$old_pid/cmdline" | grep -F -- "$PROJECT_BINARY" >/dev/null; then
                kill "$old_pid"
                for _ in 1 2 3 4 5; do
                  kill -0 "$old_pid" 2>/dev/null || break
                  sleep 1
                done
                if kill -0 "$old_pid" 2>/dev/null; then
                  echo "Leave_test process did not stop: $old_pid" >&2
                  exit 1
                fi
              fi
            fi

            mv -f "$replacement_binary" "$PROJECT_BINARY"
            chmod 0755 "$PROJECT_BINARY"

            # 使用宝塔项目自己的启动脚本，确保 PID 文件、工作目录和自启动方式保持一致。
            "$PROJECT_START_SCRIPT"
            test -f "$PROJECT_PID_FILE"
            new_pid="$(cat "$PROJECT_PID_FILE")"
            case "$new_pid" in
              ''|*[!0-9]*) echo "Invalid new PID file: $PROJECT_PID_FILE" >&2; exit 1 ;;
            esac
            kill -0 "$new_pid"
            tr '\0' ' ' < "/proc/$new_pid/cmdline"
