root = "."
tmp_dir = "tmp"

[build]
bin = "tmp/main"
cmd = "go build -o ./tmp/main ./cmd/server"
full_bin = ""
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 500
exclude_dir = ["assets", "vendor", "docs", "frontend", "client", ".idea", "tmp"]
exclude_file = []
exclude_regex = []
include_ext = ["go", "tpl", "tmpl", "html"]
log = "build-errors.log"
color = true

[misc]
clean_on_exit = true
