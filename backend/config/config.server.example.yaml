# 生产服务器模板；复制为 /www/wwwroot/Leave/config/config.server.yaml。
# MYSQL_PASSWORD、REDIS_PASSWORD 从服务器 .env 注入，不随发布包上传。
log:
  # debug、info、warn、error、dpanic、panic、fatal；在配置文件中明确填写。
  level: info
  # 服务器采用结构化 JSON 输出；需明确填写此项。
  encoding: json
  # 持久目录独立于 backend/releases；需让宝塔运行用户 www 可写。
  dir: /www/wwwroot/Leave/logs

app:
  # 不同环境设置不同 namespace，避免共享 Redis 时登录态串用。
  namespace: default
  port: 8000
  package_dir: /www/wwwroot/Leave/packages/android

storage:
  root_dir: /www/wwwroot/Leave/uploads
  base_url: http://leave.mhspace.dpdns.org/api/v1/uploads

redis:
  host: 127.0.0.1
  port: 6379
  username: ""
  # 生产环境建议通过 REDIS_PASSWORD 环境变量注入。
  password: ""
  db: 0

mysql:
  host: 127.0.0.1
  port: 3306
  database: leave_list
  user: leave_list
  password: ""

# 仅保留旧实现配置，当前服务不使用 JWT，也不要求 JWT_SECRET。
jwt:
  secret: ""
  expiration_days: 30

session:
  student_ttl: 720h
  admin_ttl: 8h
