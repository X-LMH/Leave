# APK 不应部署在 Web 服务器的静态目录；此路径可为相对 backend 工作目录的路径。
log:
  # debug、info、warn、error、dpanic、panic、fatal；在配置文件中明确填写。
  level: info
  # stderr 的输出格式 console 或 json，需明确填写；文件固定为 JSON Lines。
  encoding: console
  # 留空只输出 stderr；相对路径基于进程工作目录。
  dir: ""

app:
  # 不同环境设置不同 namespace，避免共享 Redis 时登录态串用。
  namespace: default
  # HTTP 服务监听端口，必须填写。
  port: 8080
  # 服务器上用于存放已发布 APK 的绝对目录。
  package_dir: "/www/wwwroot/Leave/packages"

storage:
  # 上传文件的持久化根目录，应与 Nginx 静态文件目录一致。
  root_dir: "/www/wwwroot/Leave/uploads"
  # 替换为实际文件访问前缀；后端拼接数据库中的相对路径生成访问地址。
  base_url: "https://example.com/api/v1/uploads"

redis:
  host: 127.0.0.1
  port: 6379
  # 默认用户可留空；使用 ACL 时填写用户名。
  username: ""
  # 可通过 REDIS_PASSWORD 环境变量覆盖。
  password: ""
  db: 0

mysql:
  host: localhost
  port: 3306
  database: leave_list
  user: root
  password: ""

# JWT 配置仅保留给旧实现，当前服务不再使用。
jwt:
  # 当前服务不要求配置 JWT_SECRET。
  secret: ""
  expiration_days: 30

session:
  student_ttl: 720h
  admin_ttl: 8h
