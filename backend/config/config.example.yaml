# APK 不应部署在 Web 服务器的静态目录；此路径可为相对 backend 工作目录的路径。
app:
  # HTTP 服务监听端口，未配置时默认为 10000。
  port: 10000
  # 服务器上用于存放已发布 APK 的绝对目录。
  package_dir: "/www/wwwroot/Leave/packages"

mysql:
  host: "localhost"
  port: 3306
  database: "leave_list"
  user: "root"
  password: ""

# JWT 签名密钥；生产环境建议使用 JWT_SECRET 环境变量覆盖
jwt:
  # 生产环境建议通过 JWT_SECRET 环境变量注入；该值为空时程序会启动失败。
  secret: ""
  expiration_days: 30