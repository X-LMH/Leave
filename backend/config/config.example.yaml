mysql:
  host: "localhost"
  port: 3306
  database: "leave_list"
  user: "root"
  password: ""

# JWT 签名密钥；生产环境建议使用 JWT_SECRET 环境变量覆盖
jwt:
  secret: "replace-this-in-production"

# APK 不应部署在 Web 服务器的静态目录；此路径可为相对 backend 工作目录的路径。
app:
  # 相对于 backend 进程的工作目录，安装包位于 backend 同级的 releases 目录。
  package_dir: "../releases"
