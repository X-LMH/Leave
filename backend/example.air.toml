# Shared Air configuration for Linux/WSL and macOS.
# Run `air -c example.air.toml` from the backend directory.
root = "."
tmp_dir = "tmp"

[build]
bin = "tmp/main"
# Build a native binary for the current host OS and architecture.
# Keep GOOS/GOARCH unset so this works on both Linux/WSL and macOS.
cmd = "go build -o ./tmp/main ."
full_bin = ""
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 500
exclude_dir = ["assets", "vendor", "docs", "frontend", "client", ".idea", "tmp"]
exclude_file = []
exclude_regex = []
include_ext = ["go", "tpl", "tmpl", "html"]
log = "build-errors.log"
color = true

[misc]
clean_on_exit = true