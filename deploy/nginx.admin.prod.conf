# 生产 admin 首次建站模板；日常发布不改写 Nginx。
# 宝塔新建静态站点后合入以下配置，保留面板生成的证书及验证目录配置。
server {
    listen 8001;
    server_name admin.leave.mhspace.dpdns.org;
    root /www/wwwroot/Leave/admin/current;
    index index.html;

    location ^~ /api/v1/uploads/avatars/ {
        alias /www/wwwroot/Leave/uploads/avatars/;
        autoindex off;
        expires 7d;
    }

    # 不带尾部斜杠，保留接口的 /api/v1/ 前缀。
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # 缺失资源返回 404，避免把 SPA 首页当作 JS/CSS 返回。
    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    access_log /www/wwwlogs/admin.leave.mhspace.dpdns.org.log;
    error_log /www/wwwlogs/admin.leave.mhspace.dpdns.org.error.log;
}
