# Docker 使用时，将本文件挂载到 /etc/nginx/conf.d/default.conf，
# 将项目 uploads 目录挂载到 /www/wwwroot/Leave/uploads，并映射端口 8081:8081。
server {
    listen 8081;
    server_name localhost;

    # SERVER-BLOCK START
    location ^~ /api/v1/uploads/avatars/ {
        alias /www/wwwroot/Leave/uploads/avatars/;
        autoindex off;
        expires 7d;
    }
    # SERVER-BLOCK END
}
