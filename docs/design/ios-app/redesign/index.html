<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light" />
    <title>请假 · 全新 iOS 设计</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="flows.css" />
    <script src="regions.js" defer></script>
    <script src="app.js" defer></script>
    <script src="flows.js" defer></script>
  </head>
  <body>
    <aside class="workbench">
      <a href="./" class="wordmark">Leave<span>INTERFACE STUDY · 03</span></a>
      <div class="intro">
        <p class="overline">重新设计，从日常出发</p>
        <h1>信息在前。<br />操作随手。</h1>
        <p>以 iOS 的内容层级和交互习惯，<br />重新组织你的校园请假。</p>
      </div>
      <nav class="screen-picker" aria-label="预览页面"></nav>
      <details class="scenario-controls">
        <summary>演示场景</summary>
        <div id="scenario-options"></div>
        <p>
          仅模拟界面状态，不上传、下载或安装；任何非空旧密码均可演示，不校验真实账号。刷新会重置数据。
        </p>
      </details>
      <div class="bench-bottom">
        <span class="preview-badge">交互设计预览</span>
        <p>
          全部为虚构演示数据 · 不连接后端<br />原 App 页面及上一版预览均已保留
        </p>
        <a href="../">查看上一版</a>
      </div>
    </aside>
    <main class="stage">
      <div class="phone">
        <div class="status" aria-hidden="true">
          <span>9:41</span>
          <div class="island"></div>
          <span class="system-status"
            >▮▮▮
            <svg viewBox="0 0 20 16">
              <path d="M2 5q8-7 16 0M5 8q5-4 10 0M8 11q2-2 4 0" /></svg
            ><span class="battery"></span
          ></span>
        </div>
        <div id="app" class="app"></div>
        <div class="home-indicator" aria-hidden="true"></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
        <dialog
          id="confirmation"
          class="sheet confirmation"
          aria-labelledby="confirmation-title"
        ></dialog>
      </div>
      <p class="stage-caption">
        <span>全新设计 / 内容优先</span><span>390 × 844</span>
      </p>
    </main>
  </body>
</html>
